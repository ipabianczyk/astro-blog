media:
  input: public/images
  output: /images

content:
  - name: blog_polska
    label: Blog ogólnopolski
    type: collection
    path: src/content/blog-polska
    fields:
      - { name: title, label: Tytuł, type: string }
      - { name: description, label: Opis, type: text }
      - { name: date, label: Data, type: date }
      - { name: body, label: Treść, type: rich-text }

  - name: blog_sosnowiec
    label: Blog Sosnowiec
    type: collection
    path: src/content/blog-sosnowiec
    fields:
      - { name: title, label: Tytuł, type: string }
      - { name: description, label: Opis, type: text }
      - { name: date, label: Data, type: date }
      - { name: body, label: Treść, type: rich-text }